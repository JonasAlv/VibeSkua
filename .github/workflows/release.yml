name: Release VibeSkua

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v2.1.0). Leave blank to use tag or Directory.Build.props'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install System Dependencies & appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file curl tar gzip
          sudo curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" Directory.Build.props || echo "2.1.0")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Package Linux AppImages
        run: |
          chmod +x ./BuildProject.sh ./package-linux.sh
          ./package-linux.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          ASSET="Build/VibeSkua-linux-AppImage.tar.gz"
          if [ ! -f "$ASSET" ]; then
            echo "Error: Release asset $ASSET not found!" >&2
            exit 1
          fi

          echo "Publishing release $TAG with asset $ASSET..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --notes ""
          fi
          echo "Release $TAG published successfully!"
