name: Release VibeSkua

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v2.1.0). Leave blank to use tag or Directory.Build.props'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install System Dependencies & appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y file curl tar gzip zip python3-pil
          sudo curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" Directory.Build.props || echo "2.1.0")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Package Linux AppImages
        env:
          # appimagetool is itself an AppImage; extraction avoids depending on
          # FUSE package names that differ between GitHub Ubuntu images.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x ./BuildProject.sh ./package-linux.sh ./build-config.sh
          ./package-linux.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          ASSETS=(
            "Build/VibeSkua-x86_64.AppImage"
            "Build/VibeSkua-Manager-x86_64.AppImage"
            "Build/VibeSkua-linux-AppImage.tar.gz"
            "Build/VibeSkua-linux-AppImage.zip"
          )
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Error: Release asset $asset not found!" >&2
              exit 1
            fi
          done

          echo "Publishing release $TAG with assets: ${ASSETS[*]}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes "Automated release $TAG bundled with official retr0gr4d3/skua-mugetsu."
          fi
          echo "Release $TAG published successfully!"
