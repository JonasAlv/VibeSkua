name: Release BonxieMux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v2.1.1). Leave blank to read Version from Directory.Build.props'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Linux AppImages & Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install System Dependencies & appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y file gcc curl tar gzip zip python3-pil
          sudo curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Determine Version Tag
        id: get_version
        run: |
          source ./build-config.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v${APP_VERSION}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG (version: $VERSION)"

      - name: Package Linux AppImages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          Version: ${{ steps.get_version.outputs.version }}
        run: |
          chmod +x ./build-appimages.sh ./build-config.sh
          ./build-appimages.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          ASSETS=(
            "Build/BonxieMux-${VERSION}-x86_64.AppImage"
            "Build/BonxieMux-Manager-${VERSION}-x86_64.AppImage"
            "Build/BonxieMux-${VERSION}-x86_64.tar.gz"
            "Build/BonxieMux-${VERSION}-x86_64.zip"
          )
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Error: Release asset $asset not found!" >&2
              exit 1
            fi
          done

          echo "Publishing release $TAG with assets: ${ASSETS[*]}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "BonxieMux $TAG" --notes "Automated release $TAG bundled with official retr0gr4d3/skua-mugetsu."
          fi
          echo "Release $TAG published successfully!"
